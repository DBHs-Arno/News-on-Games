<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Veri Merkezi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        header { text-align: center; padding: 40px 0; background-color: #1f1f1f; border-bottom: 3px solid #00d2d3; margin-bottom: 30px; }
        h1 { margin: 0; color: #00d2d3; letter-spacing: 2px; }
        .container { max-width: 900px; margin: 0 auto; }
        .news-card { background-color: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 8px; border-left: 4px solid #ff4757; transition: transform 0.2s; }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .news-category { font-size: 0.8em; color: #ffa502; text-transform: uppercase; font-weight: bold; }
        .news-title { font-size: 1.4em; margin: 10px 0; color: #ffffff; }
        .news-date { font-size: 0.8em; color: #747d8c; margin-bottom: 15px; display: block; }
        .read-more { color: #00d2d3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 OYUN VERİ MERKEZİ</h1>
        <p>Otomatik Haber Agregatörü (Web Scraping Engine)</p>
    </header>

    <div class="container" id="news-container">
        <!-- Haberler buraya JavaScript ile JSON'dan otomatik yüklenecek -->
        <p style="text-align: center; color: #747d8c;">Haberler yükleniyor...</p>
    </div>

    <script>
        // news.json dosyasını çekip siteye ekleyen asenkron fonksiyon
        async function fetchNews() {
            try {
                const response = await fetch('news.json');
                const newsData = await response.json();
                
                const container = document.getElementById('news-container');
                container.innerHTML = ''; // Yükleniyor yazısını temizle

                newsData.forEach(item => {
                    const article = document.createElement('div');
                    article.className = 'news-card';
                    article.innerHTML = `
                        <span class="news-category">${item.category}</span>
                        <h2 class="news-title">${item.title}</h2>
                        <span class="news-date">${item.date}</span>
                        <p>${item.summary}</p>
                        <a href="${item.link}" class="read-more">Devamını Oku &rarr;</a>
                    `;
                    container.appendChild(article);
                });
            } catch (error) {
                console.error("Haberler yüklenemedi:", error);
                document.getElementById('news-container').innerHTML = '<p>Veri çekme hatası! Lütfen daha sonra tekrar deneyin.</p>';
            }
        }

        // Sayfa yüklendiğinde fonksiyonu çalıştır
        fetchNews();
    </script>
</body>
</html>
