<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Data Hub | Analytics & Global Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151922;
            --bg-accent: #1f2430;
            --accent-primary: #7000ff;
            --accent-cyan: #00f2fe;
            --text-main: #e6e8ee;
            --text-muted: #8b949e;
            --border-color: #2a303c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }

        header { background: linear-gradient(180deg, #121620 0%, var(--bg-main) 100%); padding: 35px 20px 20px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .logo-title { font-size: 2.2rem; font-weight: 800; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 5px; }

        nav { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .nav-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; }
        .nav-btn.active, .nav-btn:hover { background: var(--accent-primary); border-color: var(--accent-primary); }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        /* Dashboard Cards Grid */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .dash-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .dash-title { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }

        /* Controls & Search */
        .controls-bar { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 250px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 18px; border-radius: 8px; font-size: 0.95rem; }

        /* News Cards */
        .news-grid { display: grid; gap: 20px; }
        .news-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 22px; transition: transform 0.2s, border-color 0.2s; }
        .news-card:hover { border-color: var(--accent-cyan); transform: translateY(-2px); }

        .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; margin-bottom: 10px; color: var(--text-muted); }
        .source-tag { background: var(--bg-accent); padding: 3px 10px; border-radius: 4px; font-weight: 600; color: var(--accent-cyan); }
        .sentiment-badge { padding: 3px 10px; border-radius: 12px; font-weight: 600; font-size: 0.75rem; }
        .sentiment-success { background: rgba(46, 213, 115, 0.15); color: #2ed573; }
        .sentiment-info { background: rgba(112, 161, 255, 0.15); color: #70a1ff; }
        .sentiment-danger { background: rgba(255, 71, 87, 0.15); color: #ff4757; }

        .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
        .card-summary { color: #b0b8c4; font-size: 0.95rem; margin-bottom: 15px; }

        .tags-wrapper { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .tag { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; color: var(--text-muted); }

        .card-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; }
        .read-btn { color: var(--accent-cyan); text-decoration: none; font-weight: 600; font-size: 0.9rem; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); max-width: 650px; width: 100%; border-radius: 12px; padding: 30px; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">🎮 GAME DATA HUB</div>
        <div class="subtitle">Real-time Gaming News Aggregator & Data Science Intelligence Pipeline</div>
        <nav>
            <button class="nav-btn active" onclick="switchTab('feed')">📰 Live Feed</button>
            <button class="nav-btn" onclick="switchTab('analytics')">📊 NLP Analytics Dashboard</button>
        </nav>
    </header>

    <div class="container">

        <!-- ANALYTICS SECTION -->
        <div id="analytics-section" class="dashboard-grid" style="display:none;">
            <div class="dash-card">
                <div class="dash-title">NLP Sentiment Distribution</div>
                <canvas id="sentimentChart"></canvas>
            </div>
            <div class="dash-card">
                <div class="dash-title">Sources Breakdown</div>
                <canvas id="sourceChart"></canvas>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls-bar" id="controls-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="Search news, topics, or games..." oninput="filterNews()">
        </div>

        <!-- NEWS FEED -->
        <div id="news-container" class="news-grid">
            <p style="text-align:center; color: var(--text-muted);">Loading live dataset...</p>
        </div>

    </div>

    <!-- MODAL -->
    <div class="modal" id="newsModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="color:#fff; margin-bottom:15px;"></h2>
            <div id="modalMeta" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:15px;"></div>
            <p id="modalBody" style="color:#c8d1dc; line-height:1.7; margin-bottom:20px;"></p>
            <a id="modalLink" href="#" target="_blank" class="nav-btn" style="text-decoration:none; display:inline-block;">Read Original Source &rarr;</a>
        </div>
    </div>

    <script>
        let newsData = [];
        let analyticsData = {};

        async function init() {
            try {
                const [newsRes, analyticsRes] = await Promise.all([
                    fetch('news.json'),
                    fetch('analytics.json')
                ]);
                newsData = await newsRes.json();
                analyticsData = await analyticsRes.json();

                renderNews(newsData);
                initCharts();
            } catch (e) {
                console.error("Data load error:", e);
            }
        }

        function renderNews(items) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            if(items.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No matching articles found.</p>';
                return;
            }

            items.forEach(item => {
                const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <div class="card-meta">
                        <span class="source-tag">${item.source}</span>
                        <span>${item.read_time} • ${item.date.split(' ').slice(0,4).join(' ')}</span>
                        <span class="sentiment-badge sentiment-${item.sentiment.badge}">${item.sentiment.label}</span>
                    </div>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-summary">${item.summary}</p>
                    <div class="tags-wrapper">${tagsHtml}</div>
                    <div class="card-actions">
                        <a href="#" class="read-btn" onclick="openModal(${item.id}); return false;">Expand Summary</a>
                        <a href="${item.link}" target="_blank" style="color:var(--text-muted); font-size:0.85rem; text-decoration:none;">Source 🔗</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterNews() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = newsData.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.summary.toLowerCase().includes(query) ||
                item.tags.some(t => t.toLowerCase().includes(query))
            );
            renderNews(filtered);
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'feed') {
                document.getElementById('analytics-section').style.display = 'none';
                document.getElementById('news-container').style.display = 'grid';
                document.getElementById('controls-bar').style.display = 'flex';
                event.target.classList.add('active');
            } else {
                document.getElementById('analytics-section').style.display = 'grid';
                document.getElementById('news-container').style.display = 'none';
                document.getElementById('controls-bar').style.display = 'none';
                event.target.classList.add('active');
            }
        }

        function initCharts() {
            if(!analyticsData.sentiment_distribution) return;

            // Sentiment Chart
            new Chart(document.getElementById('sentimentChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(analyticsData.sentiment_distribution),
                    datasets: [{
                        data: Object.values(analyticsData.sentiment_distribution),
                        backgroundColor: ['#2ed573', '#70a1ff', '#ff4757']
                    }]
                },
                options: { plugins: { legend: { labels: { color: '#e6e8ee' } } } }
            });

            // Source Chart
            new Chart(document.getElementById('sourceChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(analyticsData.sources_breakdown),
                    datasets: [{
                        label: 'Articles',
                        data: Object.values(analyticsData.sources_breakdown),
                        backgroundColor: '#7000ff'
                    }]
                },
                options: { scales: { y: { ticks: { color: '#8b949e' } }, x: { ticks: { color: '#8b949e' } } }, plugins: { legend: { display: false } } }
            });
        }

        function openModal(id) {
            const item = newsData.find(n => n.id === id);
            if(!item) return;
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalMeta').innerText = `${item.source} • ${item.date} • Sentiment Score: ${item.sentiment.score}`;
            document.getElementById('modalBody').innerText = item.summary;
            document.getElementById('modalLink').href = item.link;
            document.getElementById('newsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('newsModal').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
