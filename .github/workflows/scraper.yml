name: Gaming News Scraper Pipeline

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Actions sekmesinden manuel tetikleme butonunu aktif eder

permissions:
  contents: write # Botun güncellenen news.json dosyasını depoya yazabilmesi için gerekli izin

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper Bot
        run: python scraper.py

      - name: Commit and Push Updated news.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update gaming news feed [skip ci]" && git push)
